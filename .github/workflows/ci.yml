name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: split_core tests
        working-directory: packages/split_core
        run: dart pub get && dart analyze && dart test
      - name: app analyze and tests
        working-directory: apps/mobile
        run: flutter pub get && flutter analyze && flutter test
      - name: design lint
        run: tool/lint_design.sh
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: edge function tests and type check
        run: |
          deno test --allow-read --config supabase/functions/deno.json supabase/functions/
          deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      - name: migrations, RLS tests and seed (throwaway Postgres)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql > /dev/null
          supabase/tests/run.sh

  # Real-browser smoke test of the whole demo-mode flow. Manual only: it builds Flutter web
  # (about a minute and a half) and needs a Chromium download.
  web-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cd tool/web_e2e && npm install --silent && npx playwright-core install --with-deps chromium
          ./run.sh
